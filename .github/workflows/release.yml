name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version without a leading v (for example 0.2.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require main and a stable version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Releases must be dispatched from main, not $GITHUB_REF" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be MAJOR.MINOR.PATCH without a v prefix: $VERSION" >&2
            exit 1
          fi
      - name: Reject a tag at a different commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tagged=$(git rev-list -n 1 "$tag")
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "Tag $tag points to $tagged, not $GITHUB_SHA" >&2
              exit 1
            fi
            if [ "$(git cat-file -t "refs/tags/$tag")" != tag ]; then
              echo "Existing tag $tag is not annotated" >&2
              exit 1
            fi
          fi
      - name: Require the embedded version to match
        env:
          VERSION: ${{ inputs.version }}
        run: |
          embedded=$(sed -n "s/^SST_VERSION='\([0-9.]*\)'$/\1/p" bin/sst | head -n1)
          if [ "$embedded" != "$VERSION" ]; then
            echo "bin/sst SST_VERSION is '$embedded', but the release input is '$VERSION'" >&2
            exit 1
          fi

  test:
    name: Test
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run checks
        run: make check

  package-deb:
    name: DEB package
    needs: test
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Build DEB
        run: packaging/build-deb.sh "$VERSION" dist
      - name: Install and smoke test DEB
        run: |
          sudo apt-get update
          sudo apt-get install -y "./dist/opensst_${VERSION}_all.deb"
          sst --help
      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: opensst-deb
          path: dist/*.deb
          retention-days: 7

  package-rpm:
    name: RPM package
    needs: test
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install RPM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
      - name: Build RPM
        run: packaging/build-rpm.sh "$VERSION" dist
      - name: Install and smoke test RPM in Fedora
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:latest \
            bash -c "dnf install -y /dist/opensst-${VERSION}-1.noarch.rpm && sst --help"
      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: opensst-rpm
          path: dist/*.rpm
          retention-days: 7

  package-arch:
    name: Arch package
    needs: test
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm base-devel git
      - name: Build Arch package as a non-root user
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su - builder -c "cd '$GITHUB_WORKSPACE' && packaging/build-arch.sh '$VERSION' dist"
      - name: Install and smoke test Arch package
        run: |
          pacman -U --noconfirm "dist/opensst-${VERSION}-1-any.pkg.tar.zst"
          sst --help
          sst --version
      - name: Upload Arch artifact
        uses: actions/upload-artifact@v4
        with:
          name: opensst-arch
          path: dist/*.pkg.tar.zst
          retention-days: 7

  release:
    name: Publish release
    needs:
      - package-deb
      - package-rpm
      - package-arch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: opensst-*
          merge-multiple: true
          path: dist
      - name: Prepare stable release assets
        run: |
          cp bin/sst dist/sst
          cp install.sh dist/install.sh
          packaging/release-assets.sh "$VERSION" dist
      - name: Configure Git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Create annotated tag
        run: |
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            if [ "$(git rev-list -n 1 "$tag")" != "$GITHUB_SHA" ]; then
              echo "Existing tag $tag does not point to $GITHUB_SHA" >&2
              exit 1
            fi
            if [ "$(git cat-file -t "refs/tags/$tag")" != tag ]; then
              echo "Existing tag $tag is not annotated" >&2
              exit 1
            fi
          else
            git tag -a "$tag" -m "OpenSST $tag"
            git push origin "refs/tags/$tag"
          fi
      - name: Create GitHub Release
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "$tag" \
              dist/sst \
              dist/install.sh \
              dist/opensst.deb \
              dist/opensst.rpm \
              dist/opensst.pkg.tar.zst \
              "dist/opensst_${VERSION}_all.deb" \
              "dist/opensst-${VERSION}-1.noarch.rpm" \
              "dist/opensst-${VERSION}-1-any.pkg.tar.zst" \
              dist/SHA256SUMS
          fi
