name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install index tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils createrepo-c rpm
      - name: Run checks
        run: make check

  package-deb:
    name: DEB package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read embedded version
        run: |
          version=$(sed -n "s/^SST_VERSION='\([0-9.]*\)'$/\1/p" bin/sst)
          echo "VERSION=$version" >>"$GITHUB_ENV"
      - name: Build DEB
        run: packaging/build-deb.sh "$VERSION" dist
      - name: Install and smoke test DEB
        run: |
          sudo apt-get update
          sudo apt-get install -y "./dist/opensst_${VERSION}_all.deb"
          sst --help
      - name: Consume the apt repository via apt-get
        run: |
          set -o pipefail
          packaging/site-build.sh "$VERSION" deb dist site
          echo "deb [trusted=yes] file://$PWD/site/deb ./" \
            | sudo tee /etc/apt/sources.list.d/opensst-test.list >/dev/null
          : >/tmp/opensst-apt-err.log
          sudo apt-get update 2>>/tmp/opensst-apt-err.log
          sudo apt-get install -y --reinstall opensst 2>>/tmp/opensst-apt-err.log
          sudo rm -f /etc/apt/sources.list.d/opensst-test.list
          sst --version | grep -Fx "sst $VERSION"
          if grep -Eq '^(W:|E:)' /tmp/opensst-apt-err.log; then
            echo '::error::apt emitted warnings or errors (no-warning guarantee violated)' >&2
            cat /tmp/opensst-apt-err.log >&2
            exit 1
          fi
      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: opensst-deb
          path: dist/*.deb
          retention-days: 7

  package-rpm:
    name: RPM package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read embedded version
        run: |
          version=$(sed -n "s/^SST_VERSION='\([0-9.]*\)'$/\1/p" bin/sst)
          echo "VERSION=$version" >>"$GITHUB_ENV"
      - name: Install RPM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
      - name: Build RPM
        run: packaging/build-rpm.sh "$VERSION" dist
      - name: Install and smoke test RPM in Fedora
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:latest \
            bash -c "dnf install -y /dist/opensst-${VERSION}-1.noarch.rpm && sst --help"
      - name: Consume the RPM repository via dnf
        run: |
          set -o pipefail
          mkdir -p site
          docker run --rm -v "$PWD:/repo:ro" -v "$PWD/site:/site" fedora:latest \
            bash -c "dnf install -y createrepo_c >/dev/null 2>&1 \
              && cd /repo && packaging/site-build.sh '$VERSION' rpm /repo/dist /site \
              && dnf --repofrompath=opensst,file:///site/rpm --setopt=opensst.gpgcheck=0 install -y opensst 2>/site/dnf-err.log \
              && sst --version | grep -Fx 'sst $VERSION'"
          if grep -Eq '^Warning' "$PWD/site/dnf-err.log"; then
            echo '::error::dnf emitted warnings (no-warning guarantee violated)' >&2
            cat "$PWD/site/dnf-err.log" >&2
            exit 1
          fi
      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: opensst-rpm
          path: dist/*.rpm
          retention-days: 7

  package-arch:
    name: Arch package
    needs: test
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Read embedded version
        run: |
          version=$(sed -n "s/^SST_VERSION='\([0-9.]*\)'$/\1/p" bin/sst)
          echo "VERSION=$version" >>"$GITHUB_ENV"
      - name: Install build tools
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm base-devel git
      - name: Build Arch package as a non-root user
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su - builder -c "cd '$GITHUB_WORKSPACE' && packaging/build-arch.sh '$VERSION' dist"
      - name: Install and smoke test Arch package
        run: |
          pacman -U --noconfirm "dist/opensst-${VERSION}-1-any.pkg.tar.zst"
          sst --help
          sst --version
      - name: Build and verify the pacman repository site
        run: |
          su - builder -c "cd '$GITHUB_WORKSPACE' && packaging/site-build.sh '$VERSION' dist site"
          su - builder -c "cd '$GITHUB_WORKSPACE' && SST_TESTS_FILTER='^test_site_build_arch\$' bash tests/run.bash"
      - name: Consume the pacman repository via pacman -Sy
        run: |
          set -o pipefail
          repo_root="$PWD/site/arch"
          mkdir -p /tmp/sst-repo-db /tmp/sst-repo-cache
          printf '[options]\nHoldPkg = pacman glibc\n\n[opensst]\nServer = file://%s\nSigLevel = Never\n' \
            "$repo_root" >/tmp/opensst-pacman.conf
          pacman -Sy --config /tmp/opensst-pacman.conf \
            --dbpath /tmp/sst-repo-db --cachedir /tmp/sst-repo-cache 2>/tmp/opensst-err.log
          pacman -S --noconfirm \
            --assume-installed bash --assume-installed openssh --assume-installed curl \
            --config /tmp/opensst-pacman.conf \
            --dbpath /tmp/sst-repo-db --cachedir /tmp/sst-repo-cache \
            opensst 2>>/tmp/opensst-err.log
          sst --version | grep -Fx "sst $VERSION"
          if grep -Ev '^(::|[[:space:]]*$)' /tmp/opensst-err.log | grep -q .; then
            echo '::error::pacman emitted unexpected stderr (no-warning guarantee violated)' >&2
            cat /tmp/opensst-err.log >&2
            exit 1
          fi
      - name: Upload Arch artifact
        uses: actions/upload-artifact@v4
        with:
          name: opensst-arch
          path: dist/*.pkg.tar.zst
          retention-days: 7
